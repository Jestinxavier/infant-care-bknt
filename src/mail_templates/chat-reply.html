<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You have a reply from our support team</title>
    <style>
      img { max-width: 100%; height: auto; }
      .email-container { max-width: 620px; width: 100%; }
      @media only screen and (max-width: 620px) {
        .email-container { width: 100% !important; max-width: 100% !important; }
      }
    </style>
  </head>
  <body style="margin:0; padding:0; background:#e5e7eb; font-family:Arial,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="min-width:100%; background:#e5e7eb;">
      <tr><td align="center" style="padding:8px;">
        <table class="email-container" width="620" cellpadding="0" cellspacing="0" style="background:#fff; margin:0 auto;">
          <tr>
            <td align="center" style="padding:16px; border-bottom:1px solid #e5e7eb; background:#fff7fb;">
              <img src="{{emailLogoDataUrl}}" alt="Infants Care" width="90" style="display:block; max-width:90px; height:auto; border:0;" />
            </td>
          </tr>
          <tr>
            <td style="padding:24px 20px; color:#1f2937; line-height:1.5; font-size:14px;">
              <p style="margin:0 0 10px;">Hello <strong>{{customerName}}</strong>,</p>
              <p style="margin:0 0 16px;">{{staffName}} from our support team replied to your chat:</p>
              <div style="border:1px solid #fbcfe8; background:#fff7fb; border-radius:8px; padding:12px 14px; margin:0 0 20px; white-space:pre-wrap;">{{reply}}</div>
              <p style="text-align:center; margin:20px 0;">
                <a href="{{siteUrl}}" style="display:inline-block; background:#ec4899; color:#fff !important; padding:12px 22px; text-decoration:none; border-radius:6px; font-weight:bold;">Continue the chat</a>
              </p>
              <p style="margin:16px 0 0; color:#6b7280; font-size:12px;">Open our website on the device you chatted from and tap the chat button to reply.</p>
            </td>
          </tr>
          <tr><td align="center" style="padding:16px; font-size:11px; color:#6b7280; border-top:1px solid #e5e7eb; background:#f9fafb;">© Infants Care. This is an automated email.</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
